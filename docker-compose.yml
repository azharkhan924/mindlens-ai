version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindlens-postgres
    environment:
      POSTGRES_DB: mindlens
      POSTGRES_USER: mindlens
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mindlens-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mindlens
      - SPRING_DATASOURCE_USERNAME=mindlens
      - SPRING_DATASOURCE_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mindlens-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PROXY_URL=http://backend:8081
    depends_on:
      - backend

volumes:
  pgdata:
